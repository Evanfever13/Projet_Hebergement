<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Créez et consultez les tickets BonnelaTomate.">
        <title>Tickets | BonnelaTomate</title>
        <link rel="stylesheet" href="/styles.css">
        <script src="/ticket.js" defer></script>
    </head>
    <body>
        <header class="site-header">
            <a class="brand" href="/" aria-label="BonnelaTomate, accueil">🍅 BonnelaTomate</a>
            <nav aria-label="Navigation principale">
                <a href="/">Accueil</a>
                <a href="/ticket" aria-current="page">Tickets</a>
                <a href="/#contact">Contact</a>
            </nav>
        </header>

        <main class="page-shell">
            <section class="page-heading">
                <p class="eyebrow">On est là pour vous aider</p>
                <h1>Créer un ticket</h1>
                <p>Décrivez votre demande et nous la traiterons au plus vite.</p>
            </section>

            <section class="ticket-layout" aria-label="Gestion des tickets">
                <form id="ticket-form" class="panel ticket-form">
                    <h2>Votre demande</h2>
                    <label for="title">Sujet</label>
                    <input id="title" name="title" type="text" maxlength="100" required
                        placeholder="Ex. : Besoin d'aide pour mon hébergement">

                    <label for="description">Description</label>
                    <textarea id="description" name="description" maxlength="500" rows="6" required
                        placeholder="Expliquez-nous votre situation (500 caractères maximum)."></textarea>

                    <div class="form-row">
                        <div>
                            <label for="time">Temps estimé (minutes)</label>
                            <input id="time" name="time" type="number" min="0" step="1" required value="0">
                        </div>
                        <div>
                            <label for="adopt">Personnes concernées</label>
                            <input id="adopt" name="adopt" type="number" min="0" step="1" required value="1">
                        </div>
                    </div>

                    <button class="button button-primary" type="submit">Envoyer le ticket</button>
                    <button class="button button-secondary" id="load-tickets" type="button">Afficher les tickets</button>
                    <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
                </form>

                <section class="panel ticket-list-panel" aria-labelledby="tickets-heading">
                    <h2 id="tickets-heading">Tickets</h2>
                    <p id="ticket-list-message" class="muted">Les tickets apparaîtront ici.</p>
                    <ul id="ticket-list" class="ticket-list"></ul>
                </section>
            </section>
        </main>

        <footer class="site-footer">
            <p>© BonnelaTomate — À votre écoute 🍅</p>
        </footer>
    </body>
</html>
